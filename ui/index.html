<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Agentic OS | talabat Obsidian Command Center</title>
<meta name="description" content="Obsidian command center for the talabat Agentic OS — AI-enabled capital allocation for the 2026 USD 175m investment programme. Dependency-free, no build step, real-time client clock." />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#051424" />
<style>
/* ==========================================================================
   Agentic OS — design tokens
   Obsidian/cyan/purple glassmorphic system, hand-written (no CDN deps) so it
   renders identically offline or online. Swap in Geist / Space Mono via
   <link> tags if network access to fonts.googleapis.com is available; the
   stacks below degrade gracefully to system fonts otherwise.
   ========================================================================== */
:root {
  --obsidian-deep: #051424;
  --surface: #0c1c2e;
  --surface-card: rgba(15, 30, 48, 0.55);
  --surface-card-hover: rgba(15, 30, 48, 0.8);
  --border-soft: rgba(255, 255, 255, 0.07);
  --border: rgba(255, 255, 255, 0.12);
  --ink: #e3e2e6;
  --ink-dim: #9aa3ab;
  --ink-faint: #6b7480;
  --cyan: #00dbe9;
  --purple: #7701d0;
  --green: #00ff66;
  --amber: #ffb800;
  --red: #ff4d5e;
  --font-head: "Geist", "Segoe UI Semibold", system-ui, -apple-system, sans-serif;
  --font-body: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Space Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--obsidian-deep);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
}
/* animated perspective grid backdrop */
body::before {
  content: "";
  position: fixed;
  inset: -50% -50% auto auto;
  width: 200%; height: 200%;
  background-image:
    linear-gradient(rgba(0, 219, 233, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 219, 233, 0.035) 1px, transparent 1px);
  background-size: 50px 50px;
  transform: perspective(1000px) rotateX(60deg) translateY(-25%);
  animation: grid-move 60s linear infinite;
  z-index: -1;
  pointer-events: none;
}
@keyframes grid-move { from { background-position: 0 0; } to { background-position: 0 600px; } }
@media (prefers-reduced-motion: reduce) { body::before { animation: none; } }

a { color: inherit; }
.material { font-family: initial; }

/* ---------- glass / motion primitives ---------- */
.glass {
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: var(--surface-card);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  transition: border-color .35s cubic-bezier(.2,.8,.2,1), background .35s cubic-bezier(.2,.8,.2,1), transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s cubic-bezier(.2,.8,.2,1);
}
.glass:hover {
  border-color: rgba(0, 219, 233, 0.35);
  background: var(--surface-card-hover);
  transform: translateY(-3px);
  box-shadow: 0 14px 40px -14px rgba(0, 219, 233, 0.18);
}
.glow-cyan { box-shadow: 0 0 22px rgba(0, 219, 233, 0.16); }
.glow-purple { box-shadow: 0 0 22px rgba(119, 1, 208, 0.18); }
@keyframes pulse-border { 0%, 100% { border-color: rgba(0, 219, 233, 0.22); } 50% { border-color: rgba(119, 1, 208, 0.55); } }
.thinking-border { animation: pulse-border 3s infinite; border-width: 1.5px; }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); background-size: 200% 100%; animation: shimmer 2.2s infinite linear; }
@keyframes soft-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .78; } }
.pulse-text { animation: soft-pulse 2.4s ease-in-out infinite; }
@keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.enter { animation: fade-up .5s cubic-bezier(.2,.8,.2,1) both; }
@media (prefers-reduced-motion: reduce) { .thinking-border, .shimmer, .pulse-text, .enter { animation: none !important; } }

/* ---------- typography ---------- */
h1, h2, h3, h4 { font-family: var(--font-head); margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.mono { font-family: var(--font-mono); }
.label-caps { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.label-status { font-family: var(--font-mono); font-size: 11px; }
.text-dim { color: var(--ink-dim); }
.text-faint { color: var(--ink-faint); }
.text-cyan { color: var(--cyan); }
.text-purple { color: var(--purple); }
.text-green { color: var(--green); }
.text-amber { color: var(--amber); }
.text-red { color: var(--red); }

/* ---------- layout shell ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 248px; z-index: 40;
  background: rgba(5,5,6,0.92); backdrop-filter: blur(24px);
  border-right: 1px solid var(--border-soft);
  display: flex; flex-direction: column; padding: 84px 0 28px;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 22px 30px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; flex: 0 0 38px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  padding: 1px;
}
.brand-mark > div { width: 100%; height: 100%; border-radius: 11px; background: var(--obsidian-deep); display: grid; place-items: center; font-weight: 800; color: var(--cyan); font-family: var(--font-head); }
.brand-name { font-family: var(--font-head); font-weight: 700; font-size: 14px; line-height: 1.2; }
.brand-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); margin-top: 1px; }

.nav { flex: 1; padding: 4px 0; overflow-y: auto; }
.nav a {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 22px; margin: 1px 0; text-decoration: none;
  color: var(--ink-faint); font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  border-right: 3px solid transparent;
  transition: all .18s ease;
}
.nav a:hover { background: rgba(255,255,255,.04); color: var(--ink); }
.nav a.active {
  background: rgba(119,1,208,.12); color: var(--purple); border-right-color: var(--purple);
}
.nav .ic { width: 18px; text-align: center; font-size: 15px; }

.sidebar-foot { padding: 18px 22px 0; }
.export-btn {
  width: 100%; padding: 11px; border: none; border-radius: 10px; cursor: pointer;
  background: linear-gradient(90deg, var(--cyan), var(--purple)); color: var(--obsidian-deep);
  font-family: var(--font-mono); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  transition: transform .18s cubic-bezier(.33,1,.68,1), box-shadow .18s ease;
}
.export-btn:hover { box-shadow: 0 0 20px rgba(0,219,233,.4); }
.export-btn:active { transform: scale(.97); }
.sidebar-links { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-soft); display: grid; gap: 10px; }
.sidebar-links a { display: flex; align-items: center; gap: 9px; color: var(--ink-faint); text-decoration: none; font-family: var(--font-mono); font-size: 11px; }
.sidebar-links a:hover { color: var(--ink); }

.main { margin-left: 248px; flex: 1; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 30; height: 64px;
  display: flex; align-items: center; gap: 16px; padding: 0 30px;
  background: rgba(18,20,25,0.72); backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border-soft);
}
.topbar h1 { font-size: 22px; color: var(--cyan); letter-spacing: -0.02em; }
.divider-v { width: 1px; height: 16px; background: var(--border); }
.tag-pill { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); background: rgba(255,255,255,.05); padding: 4px 11px; border-radius: 999px; }
.topbar-spacer { flex: 1; }
.search-box { position: relative; display: none; }
@media (min-width: 820px) { .search-box { display: flex; align-items: center; } }
.search-box input {
  background: rgba(5,5,6,.5); border: none; border-bottom: 1px solid rgba(0,219,233,.28);
  color: var(--ink); font-size: 13px; padding: 7px 34px 7px 12px; width: 230px; outline: none;
}
.search-box input:focus { border-color: var(--cyan); }
.search-box .ic { position: absolute; right: 9px; color: var(--ink-faint); font-size: 15px; }
.icon-btn { background: none; border: none; color: var(--ink-dim); cursor: pointer; font-size: 17px; padding: 4px; }
.icon-btn:hover { color: var(--cyan); }
.status-dot-ring { width: 30px; height: 30px; border-radius: 999px; border: 1px solid rgba(0,255,102,.5); padding: 2px; }
.status-dot-ring > div { width: 100%; height: 100%; border-radius: 999px; background: rgba(0,255,102,.22); animation: soft-pulse 2s infinite; }

.content { padding: 30px; max-width: 1360px; margin: 0 auto; }
.page-title { font-size: 26px; margin-bottom: 6px; }
.page-sub { color: var(--ink-dim); max-width: 760px; margin: 0 0 26px; font-size: 13.5px; }

/* ---------- grid / cards ---------- */
.grid { display: grid; gap: 18px; }
.g-12 { grid-template-columns: repeat(12, 1fr); }
.g-2 { grid-template-columns: repeat(2, 1fr); }
.g-3 { grid-template-columns: repeat(3, 1fr); }
.g-4 { grid-template-columns: repeat(4, 1fr); }
.span-8 { grid-column: span 8; }
.span-4 { grid-column: span 4; }
.span-7 { grid-column: span 7; }
.span-5 { grid-column: span 5; }
.span-6 { grid-column: span 6; }
@media (max-width: 1024px) { .g-12 > * { grid-column: span 12 !important; } .g-3, .g-4 { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 640px) { .g-2, .g-3, .g-4 { grid-template-columns: 1fr; } .sidebar { transform: translateX(-100%); } .main { margin-left: 0; } .content { padding: 18px; } }

.card { padding: 22px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.card-title { font-size: 15px; }
.card-icon-box { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.chip-green { color: var(--green); background: rgba(0,255,102,.1); border: 1px solid rgba(0,255,102,.28); }
.chip-cyan { color: var(--cyan); background: rgba(0,219,233,.1); border: 1px solid rgba(0,219,233,.28); }
.chip-purple { color: var(--purple); background: rgba(119,1,208,.14); border: 1px solid rgba(119,1,208,.3); }
.chip-amber { color: var(--amber); background: rgba(255,184,0,.1); border: 1px solid rgba(255,184,0,.28); }
.chip-dim { color: var(--ink-faint); background: rgba(255,255,255,.05); border: 1px solid var(--border); }

/* ---------- hero progress ring ---------- */
.hero-visual { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 440px; position: relative; overflow: hidden; }
.hero-visual .radial-glow { position: absolute; inset: 0; opacity: .22; pointer-events: none; background: radial-gradient(circle at center, var(--cyan) 0%, transparent 65%); filter: blur(70px); }
.ring-wrap { position: relative; width: 280px; height: 280px; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: rgba(255,255,255,.06); stroke-width: 6; }
.ring-fill { fill: none; stroke: var(--cyan); stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(0,219,233,.55)); transition: stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1); }
.ring-outer { position: absolute; inset: 18px; border-radius: 999px; border: 2px dashed rgba(0,219,233,.2); animation: spin 22s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-value { font-family: var(--font-head); font-size: 42px; font-weight: 800; color: #fff; text-shadow: 0 0 14px rgba(255,255,255,.4); }
.ring-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .18em; color: var(--cyan); margin-top: 2px; }
.hero-stats { display: flex; gap: 48px; margin-top: 30px; }
.hero-stat { text-align: center; }
.hero-stat .k { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; color: var(--ink-faint); letter-spacing: .06em; margin-bottom: 5px; }
.hero-stat .v { display: flex; align-items: center; gap: 6px; justify-content: center; font-family: var(--font-head); font-weight: 700; font-size: 17px; }

/* ---------- Qais persona header + OS crew ---------- */
:root { --mouse-x: 0.5; --mouse-y: 0.5; }
.qais-strip { display: flex; align-items: center; gap: 14px; position: relative; z-index: 2; margin-bottom: 6px; }
.qais-avatar { width: 64px; height: 64px; border-radius: 999px; flex: 0 0 64px; overflow: hidden; border: 2px solid rgba(0,219,233,.4); box-shadow: 0 0 22px rgba(0,219,233,.25); transform: perspective(600px) rotateX(calc((var(--mouse-y) - 0.5) * -8deg)) rotateY(calc((var(--mouse-x) - 0.5) * 8deg)); transition: transform .1s ease-out; }
.qais-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.qais-name { font-family: var(--font-head); font-weight: 800; font-size: 15px; color: #fff; letter-spacing: .02em; }
.qais-role { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; color: var(--cyan); text-transform: uppercase; margin-top: 1px; }
.crew-tile { position: relative; border-radius: 14px; overflow: hidden; height: 150px; cursor: pointer; }
.crew-tile .crew-bg { position: absolute; inset: 0; background-image: url('assets/team-grid.jpg'); background-size: 200% 200%; filter: saturate(.9) brightness(.75); transition: transform .4s ease, filter .4s ease; }
.crew-tile:hover .crew-bg { transform: scale(1.06); filter: saturate(1) brightness(.85); }
.crew-tile.q-zaid .crew-bg { background-position: 0% 0%; }
.crew-tile.q-layla .crew-bg { background-position: 100% 0%; }
.crew-tile.q-amir .crew-bg { background-position: 0% 100%; }
.crew-tile.q-hana .crew-bg { background-position: 100% 100%; }
.crew-tile .crew-shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(5,20,36,.94) 5%, rgba(5,20,36,.15) 65%, transparent 100%); }
.crew-tile .crew-info { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px; }
.crew-tile .crew-name { font-family: var(--font-head); font-weight: 800; font-size: 13.5px; color: #fff; }
.crew-tile .crew-role { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .08em; color: var(--cyan); text-transform: uppercase; margin: 2px 0 5px; }
.crew-tile .crew-stat { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-dim); }

/* ---------- meters / bars ---------- */
.bar-track { height: 8px; background: rgba(255,255,255,.06); border-radius: 6px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; }
.spark { display: flex; align-items: flex-end; gap: 5px; height: 96px; }
.spark > div { flex: 1; border-radius: 4px 4px 0 0; background: rgba(0,219,233,.22); transition: height .3s; min-height: 3px; }
.spark > div:hover { background: rgba(0,219,233,.5); }

/* ---------- lists / tables ---------- */
.ilist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ilist li { display: flex; align-items: center; justify-content: space-between; padding: 11px 13px; background: rgba(255,255,255,.03); border: 1px solid var(--border-soft); border-radius: 9px; }
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th { text-align: left; font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); padding: 10px 14px; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: rgba(15,17,21,.92); }
table.data td { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
table.data tr:last-child td { border-bottom: none; }
table.data tr:hover td { background: rgba(255,255,255,.025); }
.scroll-y { overflow-y: auto; }
.scroll-y::-webkit-scrollbar { width: 5px; } .scroll-y::-webkit-scrollbar-thumb { background: rgba(0,219,233,.22); border-radius: 8px; }

/* ---------- timeline (decisions) ---------- */
.tl-item { padding: 15px; background: rgba(255,255,255,.03); border-left: 2px solid var(--border); border-radius: 0 9px 9px 0; margin-bottom: 12px; cursor: default; transition: background .2s; }
.tl-item:hover { background: rgba(255,255,255,.055); }
.tl-item .tl-top { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); margin-bottom: 6px; }
.tl-item h4 { font-family: var(--font-body); font-size: 13.5px; font-weight: 600; color: var(--ink); }
.tl-item p { color: var(--ink-dim); font-size: 12.5px; margin: 5px 0 0; }

/* ---------- QA gate checklist ---------- */
.gate-row { display: flex; align-items: flex-start; gap: 13px; padding: 13px; border-radius: 9px; margin-bottom: 10px; }
.gate-pass { background: rgba(0,255,102,.05); border: 1px solid rgba(0,255,102,.16); }
.gate-next { background: rgba(119,1,208,.08); border: 1px solid rgba(119,1,208,.24); }
.gate-check { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: 0 0 20px; margin-top: 1px; }
.gate-check.pass { background: var(--green); color: #04120a; }
.gate-check.next { border: 2px solid var(--purple); }

/* ---------- neural map (SVG) ---------- */
.neuralmap { width: 100%; height: 100%; }
.nm-node circle { fill: var(--surface); stroke-width: 1.4; }
.nm-node text { font-family: var(--font-mono); fill: var(--ink-dim); font-size: 10px; }
.nm-node .nlabel { fill: #fff; font-weight: 700; font-size: 11px; }
.nm-link { stroke-width: 1; opacity: .45; }

/* footer */
.footer {
  position: sticky; bottom: 0; z-index: 20; height: 42px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
  background: rgba(10,11,14,.7); backdrop-filter: blur(12px); border-top: 1px solid var(--border-soft);
  font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint);
}
.footer a { color: var(--ink-faint); text-decoration: underline; margin-left: 16px; }
.footer a:hover { color: var(--green); }

.callout { border-left: 3px solid var(--cyan); background: rgba(0,219,233,.06); border-radius: 0 9px 9px 0; padding: 11px 14px; font-size: 12.5px; color: var(--ink-dim); }
.kbd { font-family: var(--font-mono); font-size: 10.5px; background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
.hint { font-size: 11.5px; color: var(--ink-faint); }

/* ---------- audit view: system log ---------- */
.log-panel { flex: 1; min-height: 260px; max-height: 380px; overflow-y: auto; background: rgba(0,0,0,.28); border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
.log-line { display: flex; gap: 10px; font-family: var(--font-mono); font-size: 11px; line-height: 1.4; }
.log-line .lt { color: var(--ink-faint); white-space: nowrap; }
.log-line.ok .lm { color: var(--green); }
.log-line.warn .lm { color: var(--amber); }
</style>
</head>

<div class="shell">
  <aside class="sidebar" aria-label="Primary navigation">

      <div class="brand-mark"><div>t</div></div>
      <div>
        <div class="brand-name">Agentic Core</div>
        <div class="brand-sub" id="core-version">v3.5.0 Active</div>
      </div>
    </div>
    <nav class="nav" id="nav">

  <div class="main">
    <header class="topbar">

      <div class="divider-v"></div>
      <span class="tag-pill">STRATEGIC_LAYER_A1</span>

      <button class="icon-btn" title="Settings">&#9881;</button>

    </header>

    <main class="content" id="view" tabindex="-1"></main>

    <footer class="footer">

/* ---------------- neural map ---------------- */
function neuralMapSvg(tiers) {
  const n = tiers.length;
  const cx = 380, cy = 250, rx = 300, ry = 170;
  const nodes = tiers.map((t, i) => {
    const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
    return { ...t, x: cx + Math.cos(angle) * rx * 0.72, y: cy + Math.sin(angle) * ry * 0.72 };
  });
  const links = nodes.map((node, i) => nodes[i+1] ? `<line class="nm-link" x1="${node.x}" y1="${node.y}" x2="${nodes[i+1].x}" y2="${nodes[i+1].y}" stroke="var(--cyan)"/>` : '').join('');
  const colors = ['#00dbe9','#7701d0','#00dbe9','#7701d0','#ffb800'];
  const dots = nodes.map((node, i) => `
    <g class="nm-node" transform="translate(${node.x},${node.y})">
      <circle r="26" stroke="${colors[i % colors.length]}" opacity="0.9"/>
      <circle r="26" fill="${colors[i % colors.length]}" opacity="0.08"/>
      <text class="nlabel" text-anchor="middle" y="-34">${esc(node.n)}</text>
      <text text-anchor="middle" y="5" fill="${colors[i % colors.length]}" style="font-weight:700;font-size:13px">${esc(node.count)}</text>
      <text text-anchor="middle" y="46">${esc(node.name)}</text>
    </g>`).join('');
  return `<svg class="neuralmap" viewBox="0 0 760 500" role="img" aria-label="Evidence hierarchy neural map">${links}${dots}</svg>`;
}

  if (!input) return;
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const q = input.value.trim().toLowerCase();
    if (!q) return;
    if (/dec[-\s]?0*(\d+)/.test(q)) location.hash = '#/decision';
    else if (/sec(tion)?\s*0*(\d+)|knowledge|vault/.test(q)) location.hash = '#/knowledge';
    else if (/forecast|kpi|scenario/.test(q)) location.hash = '#/forecast';
    else if (/publi|export|gate/.test(q)) location.hash = '#/publication';
    else location.hash = '#/architecture';
  });
}

/* ---------------- router ---------------- */
const VALID = Object.keys(views);
function route() {
  const id = (location.hash.replace(/^#\//, '') || 'architecture').split('?')[0];
  const view = VALID.includes(id) ? id : 'architecture';
  $$('.nav a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
  const label = { architecture: 'Agentic OS', knowledge: 'Knowledge Layer', decision: 'Decision Layer', forecast: 'Decision & Forecast', publication: 'Publication & Export', audit: 'Audit & Verification' }[view];
  $('#crumb-view').textContent = label;
  document.title = `${label} · Agentic OS`;
  $('#view').innerHTML = views[view]();
  window.scrollTo(0, 0);
}
$('#export-btn').addEventListener('click', () => { location.hash = '#/publication'; });
window.addEventListener('hashchange', route);
wireSearch();
route();

/* ---------------- real-time chrome: genuine local clock + session uptime ---------------- */
const LOAD_TS = Date.now();
function fmtDuration(totalSeconds) {
  const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
  const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
  const s = String(totalSeconds % 60).padStart(2, '0');
  return `${h}:${m}:${s}`;
}
function tickClock() {
  const now = new Date();
  const clockEl = $('#sys-clock');
  if (clockEl) clockEl.textContent = now.toTimeString().slice(0, 8) + ' LOCAL';
  const upEl = $('#sys-uptime');
  if (upEl) upEl.textContent = fmtDuration(Math.floor((Date.now() - LOAD_TS) / 1000));
}
tickClock();
setInterval(tickClock, 1000);

/* ---------------- Qais hero parallax + magnetic export button ---------------- */
document.addEventListener('mousemove', (e) => {
  const hero = $('#hero-container');
  if (!hero) return;
  const rect = hero.getBoundingClientRect();
  if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;
  hero.style.setProperty('--mouse-x', ((e.clientX - rect.left) / rect.width).toFixed(3));
  hero.style.setProperty('--mouse-y', ((e.clientY - rect.top) / rect.height).toFixed(3));
});
document.addEventListener('mousemove', (e) => {
  const btn = $('#export-btn');
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  const near = e.clientX > rect.left - 24 && e.clientX < rect.right + 24 && e.clientY > rect.top - 24 && e.clientY < rect.bottom + 24;
  if (!near) { btn.style.transform = ''; return; }
  const x = e.clientX - (rect.left + rect.width / 2);
  const y = e.clientY - (rect.top + rect.height / 2);
  btn.style.transform = `translate(${(x * 0.12).toFixed(1)}px, ${(y * 0.25).toFixed(1)}px)`;
});
</script>
