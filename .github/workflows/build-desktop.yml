name: Build Desktop Apps (Windows / macOS / Linux)

on:
  workflow_dispatch:
  push:
    branches: ["claude/talabat-agentic-os-ui-1nemuv", "main"]
    paths:
      - "app/agentic-os-console/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
          - platform: macos-latest
            label: macos
          - platform: ubuntu-22.04
            label: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (webkitgtk, appindicator)
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies (Tauri CLI)
        working-directory: app/agentic-os-console
        run: npm install

      - name: Generate full icon set from the master icon.png
        working-directory: app/agentic-os-console
        run: npm run icons

      - name: Build Tauri release bundle
        working-directory: app/agentic-os-console
        run: npm run tauri build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentic-os-console-${{ matrix.label }}
          path: |
            app/agentic-os-console/src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
